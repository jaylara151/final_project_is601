services:
  db:
    image: postgres:17
    container_name: final_project_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calculator_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calculator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: final_project_web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/calculator_db
    depends_on:
      db:
        condition: service_healthy